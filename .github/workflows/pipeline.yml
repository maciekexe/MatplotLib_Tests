name: Matplotlib OOB Testing System

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja zależności (OOB)
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib pytest
        pip install -r requirements.txt

    - name: Testy jednostkowe biblioteki Matplotlib (Wymóg prowadzącego)
      continue-on-error: true
      run: |
        echo "Uruchamiam wbudowane testy jednostkowe biblioteki Matplotlib..."
        pytest --pyargs matplotlib.tests -v -m "not network" || echo "Część wbudowanych testów pominęto/nie przeszła (to normalne środowisku CI), idziemy dalej!"

    - name: Testy Funkcjonalne
      run: |
        echo "Uruchamiam nasze testy funkcjonalne..."
        pytest src/functional_tests/ -v --basetemp=wyniki_funkcjonalne

    - name: Testy Wydajnościowe
      run: |
        echo "Uruchamiam nasze testy wydajnościowe..."
        pytest src/performance_tests/ -v -s --basetemp=wyniki_wydajnosciowe

    - name: Zapisz wygenerowane wykresy jako artefakty
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: wygenerowane-wykresy
        path: |
          wyniki_funkcjonalne/
          wyniki_wydajnosciowe/
          src/performance_tests/*.png
        retention-days: 5