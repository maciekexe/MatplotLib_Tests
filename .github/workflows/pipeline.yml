name: Matplotlib OOB Testing System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja Matplotlib (OOB)
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib numpy pytest

    - name: Testy Funkcjonalne
      run: |
        echo "Uruchamiam testy funkcjonalne Karola i Macieja..."
        pytest src/functional_tests/ -v

    - name: Testy Wydajnościowe
      run: |
        echo "Uruchamiam testy wydajnościowe Nataniela..."
        pytest src/performance_tests/ -v -s